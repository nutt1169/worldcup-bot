<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Dashboard{% endblock %} — WorldCup Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
    .sidebar { background: #1e293b; min-height: 100vh; width: 240px; position: fixed; top: 0; left: 0; padding: 1.5rem 0; }
    .sidebar .brand { color: #f59e0b; font-size: 1.2rem; font-weight: bold; padding: 0 1.5rem 1.5rem; border-bottom: 1px solid #334155; }
    .sidebar .nav-link { color: #94a3b8; padding: 0.6rem 1.5rem; border-radius: 0; transition: all 0.2s; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #f59e0b; background: #0f172a; }
    .sidebar .nav-link i { margin-right: 0.5rem; }
    .main { margin-left: 240px; padding: 2rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .card-header { background: #0f172a; border-bottom: 1px solid #334155; font-weight: 600; }
    .stat-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; }
    .stat-card .number { font-size: 2rem; font-weight: bold; color: #f59e0b; }
    .table { color: #e2e8f0; }
    .table thead th { background: #0f172a; color: #94a3b8; border-color: #334155; }
    .table tbody td { border-color: #334155; vertical-align: middle; }
    .table tbody tr:hover { background: #0f172a; }
    .badge-finished { background: #059669; }
    .badge-timed { background: #334155; color: #94a3b8; }
    .badge-live { background: #dc2626; }
    .btn-gold { background: #f59e0b; color: #0f172a; border: none; font-weight: 600; }
    .btn-gold:hover { background: #d97706; color: #0f172a; }
    .medal-1 { color: #ffd700; }
    .medal-2 { color: #c0c0c0; }
    .medal-3 { color: #cd7f32; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">⚽ SOD Draft&Craft</div>
    <ul class="nav flex-column mt-3">
      <li class="nav-item">
        <a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="/admin/dashboard">
          <i class="bi bi-speedometer2"></i> ภาพรวม
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active=='players' %}active{% endif %}" href="/admin/players">
          <i class="bi bi-people"></i> ผู้เล่น
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active=='matches' %}active{% endif %}" href="/admin/matches">
          <i class="bi bi-trophy"></i> แมตช์
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active=='predictions' %}active{% endif %}" href="/admin/predictions">
          <i class="bi bi-bullseye"></i> การทายทั้งหมด
        </a>
      </li>
      <li class="nav-item mt-3">
        <a class="nav-link" href="/admin/sync" onclick="return confirm('Sync แมตช์ใหม่?')">
          <i class="bi bi-arrow-clockwise"></i> Sync แมตช์
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/admin/broadcast">
          <i class="bi bi-megaphone"></i> Broadcast
        </a>
      </li>
      <li class="nav-item mt-auto">
        <a class="nav-link text-danger" href="/admin/logout">
          <i class="bi bi-box-arrow-left"></i> ออกจากระบบ
        </a>
      </li>
    </ul>
  </nav>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
