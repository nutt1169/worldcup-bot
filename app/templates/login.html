<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — WorldCup Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
    .login-card h2 { color: #f59e0b; font-weight: bold; }
    .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; }
    .form-control:focus { background: #0f172a; border-color: #f59e0b; color: #e2e8f0; box-shadow: 0 0 0 0.2rem rgba(245,158,11,0.15); }
    .btn-gold { background: #f59e0b; color: #0f172a; border: none; font-weight: 600; width: 100%; padding: 0.75rem; }
    .btn-gold:hover { background: #d97706; }
    .alert-danger { background: #7f1d1d; border: 1px solid #dc2626; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="font-size: 3rem;">⚽</div>
      <h2>WorldCup Admin</h2>
      <p class="text-muted">SOD Draft&Craft</p>
    </div>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold">เข้าสู่ระบบ</button>
    </form>
  </div>
</body>
</html>
